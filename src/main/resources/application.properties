spring.application.name=ConvertFormat

server.port=8081
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5434/convert_format
spring.datasource.username=convert_format
spring.datasource.password=local_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.storage.directory=${STORAGE_DIRECTORY:storage}
app.conversion.command=${LIBREOFFICE_COMMAND:libreoffice}
app.conversion.timeout=60s
app.rate-limit.upload.requests=10
app.rate-limit.upload.window=1m

springdoc.swagger-ui.path=/swagger-ui.html

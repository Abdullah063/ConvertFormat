services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: convert_format
      POSTGRES_USER: convert_format
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convert_format -d convert_format"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
